  Test_Car:
    runs-on: self-hosted
    needs: Compilation
    steps:
      - name: Test fonction car
        run: |
          last_directory=$(basename ${{ runner.workspace }})
          if [ -d "./$last_directory/.git" ]; then
            cd ./$last_directory
