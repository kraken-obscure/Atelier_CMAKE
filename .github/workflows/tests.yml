name: Automatisation des tests
on: push
jobs:
  Compilation:
    runs-on: self-hosted
    steps:
      - name: Compilation
        run: |
          last_directory=$(basename ${{ runner.workspace }})
          if [ -d "./$last_directory/.git" ]; then
            cd ./$last_directory
            git pull
          else
            git clone https://github.com/${{ github.repository }}.git
            cd ./$last_directory
          fi
          mkdir -p build
          cd build
          cmake ..
          make
          make test
  Test_Add:
    runs-on: self-hosted
    needs: Compilation
    steps:
      - name: Test fonction add
        run: |
          last_directory=$(basename ${{ runner.workspace }})
          if [ -d "./$last_directory/.git" ]; then
            cd ./$last_directory
            git pull
          else
            git clone https://github.com/${{ github.repository }}.git
            cd ./$last_directory
          fi
          mkdir -p build
          cd build
          cmake ..
          make
          ./src/calculator add 10 5
  Test_Sub:
